<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Warm Personal Archive</title>
<style>:root{--b1:#fff8ef;--b2:#f5eee5;--b3:#eef2ef;--t:#2e2924;--s:#7b7068;--o:#d99a68;--g:#8db39a;--bl:#8fb9df;--sh:0 10px 26px rgba(97,70,45,.08)}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;padding:16px 12px 40px;background:radial-gradient(circle at 10% 8%,rgba(255,214,168,.56),transparent 34%),radial-gradient(circle at 90% 4%,rgba(218,229,214,.65),transparent 32%),linear-gradient(135deg,var(--b1),var(--b2) 48%,var(--b3));color:var(--t);font-family:-apple-system,BlinkMacSystemFont,system-ui,"PingFang SC",sans-serif}.page{width:min(100%,980px);margin:auto}.head{padding:22px 18px;border-radius:26px;border:1px solid rgba(255,255,255,.76);background:linear-gradient(135deg,rgba(255,255,255,.78),rgba(255,247,237,.58));box-shadow:0 18px 50px rgba(97,70,45,.10);backdrop-filter:blur(24px)}h1{margin:0;font-size:30px;letter-spacing:-.035em}.sub{margin:9px 0 0;color:var(--s);font-size:13px;line-height:1.75}.nav{display:flex;gap:8px;margin:15px 0 18px;overflow:auto}.nav a{flex:0 0 auto;padding:7px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.72);background:rgba(255,255,255,.66);color:var(--s);text-decoration:none;font-size:12px}.section{margin-top:16px;padding:15px 13px;border-radius:24px;border:1px solid rgba(255,255,255,.70);background:rgba(255,255,255,.66);box-shadow:var(--sh);backdrop-filter:blur(20px)}.section-title{display:flex;align-items:center;gap:8px;margin:0 0 11px;font-size:16px}.dot{width:8px;height:8px;border-radius:50%}.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}.card{min-width:0;padding:13px;border-radius:19px;border:1px solid rgba(255,255,255,.78);background:linear-gradient(145deg,rgba(255,255,255,.84),rgba(255,248,241,.62));box-shadow:0 8px 16px rgba(97,70,45,.04)}.title{font-size:14px;font-weight:700;overflow-wrap:anywhere}.meta{margin-top:6px;color:var(--s);font-size:12px;line-height:1.7}@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}</style>
</head>
<body><main class="page"><header class="head"><h1>个人档案</h1><p class="sub">把常用的、重要的、舍不得删掉的，都放在一个安静的地方</p></header><nav class="nav"><a href="#daily">常用</a><a href="#travel">旅行</a><a href="#old">旧日</a></nav><section class="section" id="daily"><h2 class="section-title"><span class="dot" style="background:var(--o)"></span>常用</h2><div class="grid"><article class="card"><div class="title">主资料</div><div class="meta">真正重要的信息先清楚，再谈装饰</div></article><article class="card"><div class="title">常用入口</div><div class="meta">工具控件保持轻，不抢正文</div></article><article class="card"><div class="title">近期记录</div><div class="meta">同组信息保持靠近</div></article></div></section><section class="section" id="travel"><h2 class="section-title"><span class="dot" style="background:var(--g)"></span>旅行</h2><div class="grid"><article class="card"><div class="title">山与路</div><div class="meta">照片负责情绪，文字只说需要说的</div></article><article class="card"><div class="title">周末片段</div><div class="meta">留白不必很多，但要让人不赶</div></article><article class="card"><div class="title">下一站</div><div class="meta">一点期待，刚刚好</div></article></div></section><section class="section" id="old"><h2 class="section-title"><span class="dot" style="background:var(--bl)"></span>旧日</h2><div class="grid"><article class="card"><div class="title">旧账号</div><div class="meta">历史内容可以退后，但不需要消失</div></article><article class="card"><div class="title">旧名字</div><div class="meta">轻一点，不等于看不清</div></article><article class="card"><div class="title">旧文件</div><div class="meta">整理，也是保留的一种方式</div></article></div></section></main></body></html>
