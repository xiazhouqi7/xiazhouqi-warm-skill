<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Warm Life Page</title>
<style>:root{--t:#2e2924;--s:#7b7068;--f:#a1968d;--line:rgba(176,145,113,.18)}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;padding:22px 14px 50px;color:var(--t);font-family:-apple-system,BlinkMacSystemFont,system-ui,"PingFang SC",sans-serif;background:radial-gradient(circle at 12% 6%,rgba(255,216,177,.60),transparent 33%),radial-gradient(circle at 88% 8%,rgba(214,228,218,.72),transparent 30%),linear-gradient(135deg,#fff8ef,#f5eee5 50%,#eef2ef)}.page{width:min(100%,860px);margin:auto}.hero{padding:28px 20px;border:1px solid rgba(255,255,255,.78);border-radius:28px;background:linear-gradient(135deg,rgba(255,255,255,.79),rgba(255,247,237,.59));box-shadow:0 18px 50px rgba(97,70,45,.10);backdrop-filter:blur(24px)}.eyebrow{color:var(--s);font-size:11px;letter-spacing:.08em;text-transform:uppercase}.hero h1{margin:8px 0 0;font-size:34px;letter-spacing:-.04em}.hero p{margin:12px 0 0;color:var(--s);font-size:14px;line-height:1.8;max-width:560px}.story{margin-top:22px;display:grid;gap:14px}.note{padding:18px 17px;border-radius:22px;border:1px solid rgba(255,255,255,.72);background:rgba(255,255,255,.64);box-shadow:0 8px 22px rgba(97,70,45,.06);backdrop-filter:blur(18px)}.note h2{margin:0;font-size:17px}.note p{margin:8px 0 0;color:var(--s);font-size:13px;line-height:1.8}.tail{margin:26px 4px 0;color:var(--f);font-size:12px;line-height:1.8}@media(min-width:720px){.story{grid-template-columns:1.1fr .9fr}.note:first-child{grid-row:span 2}.hero{padding:34px 30px}}</style>
</head>
<body><main class="page"><section class="hero"><div class="eyebrow">Xiazhouqi Warm</div><h1>最近的日子</h1><p>没有什么宏大的主题，只是把一些微小的事情认真记下来</p></section><section class="story"><article class="note"><h2>周末</h2><p>走了一段不太远的路。风很轻，天也没有急着变暗。照片里留下的，比文字更多</p></article><article class="note"><h2>正在学</h2><p>把复杂的东西慢慢拆开，一点一点变成自己能理解的样子</p></article><article class="note"><h2>下一站</h2><p>还没有决定。先把期待留在这里</p></article></section><p class="tail">有些东西不用急着完成，慢慢长成自己的样子就好</p></main></body></html>
